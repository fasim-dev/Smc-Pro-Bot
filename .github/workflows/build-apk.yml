name: Build SMC Pro Scalper APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          test -f SMC_Pro_Scalper_Dashboard_Cloud_Build.zip
          unzip -q SMC_Pro_Scalper_Dashboard_Cloud_Build.zip -d extracted
          test -f extracted/smc_pro_scalper_android_project/settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted/smc_pro_scalper_android_project
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Pro-Scalper-debug-APK
          path: extracted/smc_pro_scalper_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
